# DMS lock screen patch (wallpaper-engine-niri/dms-lock-screen): DMS runs from a patched copy of its own UI.
# dms-lock-ui builds it and writes DMS_SHELL_DIR to the env file; without the file DMS runs its stock UI.
[Service]
ExecStartPre=-%h/.local/share/dms-lock-screen/dms-lock-ui
EnvironmentFile=-%t/dms-lock-ui.env
